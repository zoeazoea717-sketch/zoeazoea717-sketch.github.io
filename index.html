<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100905">
  <title>ZOEA</title>
  <link rel="stylesheet" href="./assets/site.css">
  <link rel="stylesheet" href="./assets/home.css">
  <link rel="stylesheet" href="./assets/archive.css">
  <script defer src="./assets/motion.js"></script>
  <script defer src="./assets/shell.js"></script>
  <script defer src="./assets/terrain.js"></script>
  <script defer src="./assets/home.js"></script>
  <script defer src="./assets/archive.js"></script>
</head>
<body>
<canvas id="crt-backplane" aria-hidden="true"></canvas>
<canvas id="crt-streams" aria-hidden="true"></canvas>
<div id="crt-screen">
<section id="zoea-monitor" aria-label="ZOEA 首页" data-crt>
  <div class="screen">
    <div class="fallback" aria-hidden="true">ZOEA</div>
    <canvas class="crt-signal" role="img" aria-label="琥珀色字符拼成的 ZOEA 字标和起伏地形，带有轻微的 CRT 曲面效果"></canvas>
    <nav class="portals" aria-label="平台入口">
      <button type="button" data-platform="Bilibili" aria-label="Bilibili"><img alt="" src="./assets/bilibili.svg" width="20" height="20"></button>
      <a href="https://www.xiaohongshu.com/user/profile/607e875f000000000100697a" target="_blank" rel="noopener noreferrer" data-platform="小红书" aria-label="小红书"><img alt="" src="./assets/xiaohongshu.svg" width="23" height="23"></a>
      <button type="button" data-platform="GitHub" aria-label="GitHub"><img alt="" src="./assets/github.svg" width="19" height="19"></button>
    </nav>
    <a class="terminal" href="#projects" aria-label="进入作品目录"><span class="terminal-label">enter</span><span class="terminal-caret" aria-hidden="true"></span></a>
  </div>
</section>
<section id="zoea-archive" aria-label="ZOEA 作品目录" data-crt hidden>
  <header>
    <a class="wordmark" href="#home" aria-label="返回 ZOEA 首页">ZOEA_</a>
    <nav aria-label="目录">
      <button type="button" data-page="project" aria-current="page">项目</button>
      <button type="button" data-page="about">关于</button>
    </nav>
  </header>
  <main>
    <div class="display">
      <canvas class="crt-signal" id="zoea-gallery" role="img" aria-label="琥珀色 CRT 内容"></canvas>
    </div>
    <div class="crt-panel">
      <div class="intro">
        <p class="prompt" id="zoea-directory">C:\ZOEA\PROJECTS&gt;</p>
        <h1 id="zoea-heading">作品</h1>
        <p id="zoea-detail" aria-live="polite"></p>
      </div>
    </div>
    <div class="index">
      <div class="list" aria-label="项目分类" id="zoea-list"><button type="button" data-category="works" aria-pressed="true">作品</button><button type="button" data-category="plugins" aria-pressed="false">插件</button><button type="button" data-category="mod" aria-pressed="false">MOD</button></div>
    </div>
  </main>
</section>
</div>
</body>
</html>
